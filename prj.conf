CONFIG_CHIP=y
CONFIG_STD_CPP17=y
CONFIG_CHIP_PROJECT_CONFIG="src/chip_project_config.h"
CONFIG_CHIP_DEVICE_VENDOR_ID=65521
CONFIG_CHIP_DEVICE_PRODUCT_ID=32772
CONFIG_CHIP_DEVICE_VENDOR_NAME="Mailbox"
CONFIG_CHIP_DEVICE_PRODUCT_NAME="XIAO Mailbox"
CONFIG_CHIP_DEVICE_SERIAL_NUMBER="XIAO_NRF_MAILBOX"
# This Kconfig symbol is hex: 0x0F00 is decimal 3840 for matter_qr.png.
CONFIG_CHIP_DEVICE_DISCRIMINATOR=0x0F00
CONFIG_CHIP_DEVICE_SPAKE2_PASSCODE=20202021
CONFIG_CHIP_FACTORY_DATA_NONE=y
CONFIG_CHIP_OTA_REQUESTOR=n
CONFIG_BOOTLOADER_MCUBOOT=n
CONFIG_USE_DT_CODE_PARTITION=y
CONFIG_CHIP_BOOTLOADER_NONE=y
CONFIG_CHIP_NFC_ONBOARDING_PAYLOAD=n
CONFIG_CHIP_ENABLE_PAIRING_AUTOSTART=n
CONFIG_BT_DEVICE_NAME="XIAO-Mailbox"
CONFIG_CHIP_BLE_EXT_ADVERTISING=y
CONFIG_CHIP_BLE_ADVERTISING_DURATION=15
CONFIG_CHIP_ENABLE_ICD_SUPPORT=y
CONFIG_CHIP_ICD_LIT_SUPPORT=n
CONFIG_OPENTHREAD_MTD=y
CONFIG_OPENTHREAD_MTD_SED=y
CONFIG_OPENTHREAD_NORDIC_LIBRARY_MTD=y
CONFIG_CHIP_ICD_SLOW_POLL_INTERVAL=15000
CONFIG_CHIP_ICD_FAST_POLLING_INTERVAL=200
CONFIG_CHIP_ICD_IDLE_MODE_DURATION=600
CONFIG_CHIP_ICD_ACTIVE_MODE_DURATION=0
CONFIG_CHIP_ICD_ACTIVE_MODE_THRESHOLD=0
CONFIG_GPIO=y
CONFIG_GPIO_HOGS=y
CONFIG_I2C=y
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y
CONFIG_DK_LIBRARY=n
CONFIG_NCS_SAMPLE_MATTER_TEST_EVENT_TRIGGERS=n
CONFIG_NCS_SAMPLE_MATTER_TEST_SHELL=n
CONFIG_CHIP_LIB_SHELL=n
CONFIG_SHELL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=n
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_MATTER_LOG_LEVEL_INF=y
CONFIG_CHIP_APP_LOG_LEVEL=3
CONFIG_RESET_ON_FATAL_ERROR=n
CONFIG_THREAD_NAME=y
CONFIG_SIZE_OPTIMIZATIONS=y

CONFIG_USB_DEVICE_STACK=n
# The SDK board defaults to a USB serial backend independently of SERIAL.
# Profiles explicitly select their console; the default image keeps USB off.
CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=n
