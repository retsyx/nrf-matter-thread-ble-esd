# Temporary native USB CDC diagnostics; application startup never waits for DTR.
CONFIG_MAILBOX_BOOT_DIAGNOSTICS=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_RTT_CONSOLE=n
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_BACKEND_RTT=n
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_OPENTHREAD_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL_CHECK_DTR=n
# Send logs through one backend; leave the shell available for mailbox status.
CONFIG_SHELL_LOG_BACKEND=n
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=16384
# Hold deferred logs briefly for USB enumeration without blocking main().
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=4000
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=y
# Bounded settling time after POST_KERNEL USB attach and before C++ constructors.
# This diagnostic pause never waits for the host or DTR.
CONFIG_BOOT_DELAY=5000
CONFIG_USB_DEVICE_REMOTE_WAKEUP=n
CONFIG_USB_CDC_ACM_RINGBUF_SIZE=8192
CONFIG_USB_DEVICE_PRODUCT="XIAO Mailbox USB diagnostics"
