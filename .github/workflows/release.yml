name: Release firmware

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release firmware
    uses: ./.github/workflows/build.yml

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download firmware for both boards
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: firmware-*
          merge-multiple: true
          path: target/firmware

      - name: Package firmware and checksums
        run: |
          mkdir -p target/release
          cp README.md VERSION target/firmware/
          printf 'Tag: %s\nCommit: %s\nSDK: 3.4.1\nProfile: default (USB and console disabled)\n' \
            "$RELEASE_TAG" "$GITHUB_SHA" > target/firmware/BUILD_INFO.txt
          cd target/firmware
          # Explicit names make a missing board or image fail the release.
          sha256sum nrf52840.uf2 nrf52840.hex nrf52840.elf \
            nrf54l15.hex nrf54l15.elf README.md VERSION BUILD_INFO.txt > SHA256SUMS
          zip -q ../release/firmware.zip nrf52840.uf2 nrf52840.hex nrf52840.elf \
            nrf54l15.hex nrf54l15.elf README.md VERSION BUILD_INFO.txt SHA256SUMS
          cd ../release
          sha256sum firmware.zip > SHA256SUMS

      - name: Publish GitHub release
        run: |
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" target/release/firmware.zip target/release/SHA256SUMS \
            --verify-tag --generate-notes --title "$RELEASE_TAG" "${flags[@]}"
